name: Windows build and release

on:
  push:
    branches: [main]
    paths:
      - src/UniLink.Core/**
      - src/UniLink.Windows/**
      - tests/UniLink.Tests/**
      - build.ps1
      - global.json
      - Directory.Build.props
      - LICENSE
      - notices/**
      - .github/workflows/windows.yml
  pull_request:
    paths:
      - src/UniLink.Core/**
      - src/UniLink.Windows/**
      - tests/UniLink.Tests/**
      - build.ps1
      - global.json
      - Directory.Build.props
      - LICENSE
      - notices/**
      - .github/workflows/windows.yml
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'windows-v')
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.426'
      - name: Test and publish Windows x64
        shell: pwsh
        run: ./build.ps1 -Runtime win-x64
      - name: Stage and test the standalone executable
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          if ($env:GITHUB_EVENT_NAME -eq 'release' -and $env:RELEASE_TAG -ne "windows-v$version") { throw 'Release tag does not match source version.' }

          $standalone = Join-Path $PWD 'artifacts/windows'
          $ui = Join-Path $PWD 'artifacts/ui-checks'
          New-Item -ItemType Directory -Force $standalone, $ui | Out-Null
          Copy-Item release/win-x64/UniLink.exe $standalone
          $exe = Join-Path $standalone 'UniLink.exe'
          $process = Start-Process -FilePath $exe -WorkingDirectory $standalone -ArgumentList @('--ui-check', ('"' + $ui + '"')) -Wait -PassThru
          Get-ChildItem $ui -Filter '*.txt' | Get-Content
          if ($process.ExitCode -ne 0) { throw "UI checks failed: $($process.ExitCode)" }
      - name: Keep UI report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-ui-checks
          path: artifacts/ui-checks/
          retention-days: 7
      - name: Keep Windows executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-executable
          path: artifacts/windows/UniLink.exe
          if-no-files-found: error
          retention-days: 14

  attach-release:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'windows-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-executable
          path: packages
      - name: Attach the tested Windows executable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" packages/UniLink.exe
