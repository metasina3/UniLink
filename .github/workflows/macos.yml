name: macOS build and release

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r src/UniLink.macOS/requirements.txt

      - name: Run macOS unit and integration tests
        run: |
          python3 -m unittest discover tests/UniLink.macOS.Tests

      - name: Package macOS App Bundle
        run: |
          mkdir -p artifacts dist
          # Run install build script
          python3 src/UniLink.macOS/install.py build
          
          APP_PATH="$HOME/Applications/UniLink.app"
          if [ -d "$APP_PATH" ]; then
            cd "$HOME/Applications"
            zip -r "$GITHUB_WORKSPACE/artifacts/UniLink-macOS.zip" "UniLink.app"
            cd "$GITHUB_WORKSPACE"
            shasum -a 256 artifacts/UniLink-macOS.zip > artifacts/UniLink-macOS.zip.sha256
          else
            echo "UniLink.app build failed" && exit 1
          fi

      - name: Keep macOS package artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-package
          path: artifacts/
          retention-days: 14

  attach-release:
    if: github.event_name == 'release'
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-release-package
          path: artifacts
      - name: Attach macOS package to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" artifacts/UniLink-macOS.zip*
