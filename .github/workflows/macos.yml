name: macOS build and release

on:
  push:
    branches: [main]
    paths:
      - src/UniLink.macOS/**
      - tests/UniLink.macOS.Tests/**
      - build-macos.sh
      - .github/workflows/macos.yml
  pull_request:
    paths:
      - src/UniLink.macOS/**
      - tests/UniLink.macOS.Tests/**
      - build-macos.sh
      - .github/workflows/macos.yml
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'macos-v')
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r src/UniLink.macOS/requirements.txt

      - name: Test and package the macOS app
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(awk '/CFBundleShortVersionString/ {getline; gsub(/<[^>]+>|[[:space:]]/, ""); print; exit}' src/UniLink.macOS/build-swift.sh)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not read the macOS source version."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == release && "$RELEASE_TAG" != "macos-v$version" ]]; then
            echo "::error::Release tag does not match the macOS source version."
            exit 1
          fi
          ./build-macos.sh "$version"

      - name: Keep macOS package artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-package
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  attach-release:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'macos-v')
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-release-package
          path: artifacts
      - name: Attach macOS package to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" artifacts/UniLink-*-macOS.*
