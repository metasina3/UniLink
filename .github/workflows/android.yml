name: Android build and release

on:
  push:
    branches: [main]
    paths:
      - src/UniLink.Android/**
      - .github/workflows/android.yml
    tags: ['android-v*']
  pull_request:
    paths:
      - src/UniLink.Android/**
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: src/UniLink.Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android SDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Check version and load Android release key
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.UNILINK_KEYSTORE_B64 }}
        run: |
          version=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$GITHUB_REF_NAME" != "android-v$version" ]]; then
            echo "::error::Release tag does not match Android versionName."
            exit 1
          fi
          if [[ -z "$ANDROID_KEYSTORE_B64" ]]; then
            echo "::error::Configure the original Android release key in Actions secrets before publishing."
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/unilink-release.jks"
          echo "UNILINK_KEYSTORE_FILE=$RUNNER_TEMP/unilink-release.jks" >> "$GITHUB_ENV"

      - name: Build and test APKs
        env:
          UNILINK_KEYSTORE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/android-v') && secrets.UNILINK_KEYSTORE_PASSWORD || '' }}
          UNILINK_KEY_ALIAS: ${{ startsWith(github.ref, 'refs/tags/android-v') && secrets.UNILINK_KEY_ALIAS || '' }}
          UNILINK_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/android-v') && secrets.UNILINK_KEY_PASSWORD || '' }}
        run: ./gradlew :app:assembleRelease :app:assembleDebug --no-daemon --stacktrace

      - name: Keep release APK
        uses: actions/upload-artifact@v4
        with:
          name: UniLink-release-apk
          path: src/UniLink.Android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Keep debug APK
        uses: actions/upload-artifact@v4
        with:
          name: UniLink-debug-apk
          path: src/UniLink.Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Keep R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: UniLink-r8-mapping
          path: src/UniLink.Android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - name: Verify signing and prepare release files
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/android-signer.txt"
          signer=$(awk '/certificate SHA-256 digest/ {print $NF; exit}' "$RUNNER_TEMP/android-signer.txt")
          debug=$(keytool -list -v -keystore app/debug.keystore -storepass android -alias androiddebugkey |
            awk '/SHA256:/ {gsub(":", "", $2); print tolower($2); exit}')
          if [[ -z "$signer" || -z "$debug" || "$signer" == "$debug" ]]; then
            echo "::error::Expected a release signature distinct from the public debug key."
            exit 1
          fi
          release_apk="UniLink-${GITHUB_REF_NAME#android-}.apk"
          mkdir -p dist
          cp "$apk" "dist/$release_apk"
          cp RELEASE_NOTES.md dist/release-notes.md
          printf '\n**Signing certificate SHA-256:** \x60%s\x60\n' "$signer" >> dist/release-notes.md
          (cd dist && sha256sum "$release_apk" > "$release_apk.sha256")

      - name: Keep signed release package
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: actions/upload-artifact@v4
        with:
          name: android-release-package
          path: src/UniLink.Android/dist/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-release-package
          path: packages
      - name: Publish the signed Android APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" packages/*.apk packages/*.sha256 \
            --verify-tag --latest=false \
            --title "UniLink for Android ${GITHUB_REF_NAME#android-}" \
            --notes-file packages/release-notes.md
